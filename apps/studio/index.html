<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI/UX Studio</title>
    <style>
      /* Application theme variables are applied by @platform/ui AppThemeProvider. */
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg, #010101);
        color: var(--text, #e6e6e6);
      }
      *, *::before, *::after { box-sizing: border-box; }
      button, input, select, textarea { font: inherit; }
      button, input, select, textarea {
        color: var(--text, #e6e6e6);
        background: var(--surface, #0d0d0f);
        border: 1px solid var(--border, #27272d);
      }
      button { cursor: pointer; }
      input::placeholder, textarea::placeholder { color: var(--text-muted, #92929d); }

      @keyframes fadeIn { 0% { opacity: 0 } 100% { opacity: 1 } }
      @keyframes slideUp { 0% { opacity: 0; transform: translateY(50px) } 100% { opacity: 1; transform: none } }
      @keyframes slideDown { 0% { opacity: 0; transform: translateY(-50px) } 100% { opacity: 1; transform: none } }
      @keyframes slideLeft { 0% { opacity: 0; transform: translateX(-50px) } 100% { opacity: 1; transform: none } }
      @keyframes slideRight { 0% { opacity: 0; transform: translateX(50px) } 100% { opacity: 1; transform: none } }
      @keyframes zoomIn { 0% { opacity: 0; transform: scale(0.3) } 100% { opacity: 1; transform: scale(1) } }
      @keyframes zoomOut { 0% { opacity: 0; transform: scale(2) } 100% { opacity: 1; transform: scale(1) } }
      @keyframes flip { 0% { opacity: 0; transform: rotateY(180deg) } 100% { opacity: 1; transform: rotateY(0) } }
      @keyframes flipX { 0% { opacity: 0; transform: rotateX(180deg) } 100% { opacity: 1; transform: rotateX(0) } }
      @keyframes flipY { 0% { opacity: 0; transform: rotateY(180deg) } 100% { opacity: 1; transform: rotateY(0) } }
      @keyframes blurIn { 0% { opacity: 0; filter: blur(20px) } 100% { opacity: 1; filter: blur(0) } }
      @keyframes scaleUp { 0% { opacity: 0; transform: scale(0.5) } 100% { opacity: 1; transform: scale(1) } }
      @keyframes pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.5 } }
      @keyframes orbit { 0% { transform: rotate(0deg) } 100% { transform: rotate(360deg) } }
      @keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-2px, 2px) } 40% { transform: translate(-2px, -2px) } 60% { transform: translate(2px, -2px) } 80% { transform: translate(2px, 2px) } 100% { transform: translate(0) } }
      @keyframes typewriter { 0% { width: 0; opacity: 1 } 10% { width: 100%; opacity: 1 } 60% { width: 100%; opacity: 1 } 100% { width: 100%; opacity: 0 } }
      @keyframes scramble { 0% { opacity: 1 } 100% { opacity: 1 } }
      @keyframes pin { 0%, 100% { opacity: 1 } 50% { opacity: 0.7 } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
